<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Ticket Status Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h2 {
            color: #312e81;
            margin-bottom: 12px;
            font-size: 25px;
        }

        #p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #e0e7ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3730a3;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="icon">🎫</div>

        <h2>Support Ticket Checker</h2>

        <p>
            Enter your Ticket ID below to check your
            support ticket details and status.
        </p>

        <input
            type="number"
            id="ticketId"
            placeholder="Enter Ticket ID (e.g. 101)"
            min="1"
        >

        <button onclick="checkTicket()">
            Search Ticket
        </button>

        <div class="footer">
            Support Ticket Status Checker
        </div>
        <p>To see the result, you need to open the Console in your browser</p>

    </div>

    <script src="Q6_TicketChecker.js"></script>

</body>

</html>
